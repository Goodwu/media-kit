name: history-strip-20261006
# 一次性任务：从全部历史剥离 archives/experiments，产出重写后 bundle 工件供本地核验后推送。
# 本 workflow 不向 origin 推送任何 ref。

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install git-filter-repo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-filter-repo

      - name: Mirror clone and record before-state
        run: |
          git clone --mirror "https://github.com/Goodwu/media-kit.git" mirror
          cd mirror
          {
            echo "OLD_MAIN=$(git rev-parse refs/heads/main)"
            echo "OLD_TREE=$(git rev-parse refs/heads/main^{tree})"
            echo "COMMITS_BEFORE=$(git rev-list --count --all)"
          } > ../before.txt
          git count-objects -vH >> ../before.txt
          git for-each-ref --format='%(refname:short) %(objectname) %(*objectname)' refs/tags | sort > ../tags-before.txt
          cat ../before.txt

      - name: filter-repo (remove archives/experiments from all history)
        run: |
          cd mirror
          git filter-repo --invert-paths --path archives/experiments

      - name: Assertions
        run: |
          cd mirror
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          n=$(git log --all --format=%H -- archives/experiments | wc -l)
          [ "$n" -eq 0 ] || fail "archives/experiments still reachable in $n commits"
          old_tree=$(sed -n 's/^OLD_TREE=//p' ../before.txt)
          new_tree=$(git rev-parse refs/heads/main^{tree})
          [ "$new_tree" = "$old_tree" ] || fail "main tree changed: $old_tree -> $new_tree"
          for sha in \
            aeb29faa8ea93a386ad1185b69fd6225fa331c74 \
            e8ef211092c0259012d52213031738416ce6ab3d \
            6c16629c2d66555d53b13fd104d8e03f8eee3407 \
            b50535856c07540ef96fc42bce551b3ccace4d27 \
            c11e6c39c388711fe2a58d6cc9ce5d26535691e9 \
            547999bfb8b5cae9f9aca6125f46fd7cb500e994 \
            cb670c6b55f4f098db55b37dda1ab6b1188be1d8 \
            ad22c36a9986a8418c81829821962009425cf5e5 \
            6139d8e8d67a7f17062740617d36bdfa8490a653 \
            994465d9bfca3f39d0b41199d16e7fd93fe97881 \
            1b1b1b697f5a1bc9d1b98ffb5d0d5c6fb8a4d8b2 ; do
            git cat-file -e "$sha^{commit}" || fail "anchor $sha lost"
          done
          echo "ASSERTIONS PASSED"

      - name: Build bundle and report
        run: |
          cd mirror
          git bundle create ../rewritten.bundle --all
          git bundle verify ../rewritten.bundle
          {
            echo "## history-strip report"
            sed -n '1,3p' ../before.txt
            echo "COMMITS_AFTER=$(git rev-list --count --all)"
            echo "OLD_MAIN -> NEW_MAIN: $(sed -n 's/^OLD_MAIN=//p' ../before.txt) -> $(git rev-parse refs/heads/main)"
            echo "TREE: $(sed -n 's/^OLD_TREE=//p' ../before.txt) == $(git rev-parse refs/heads/main^{tree}) (identical)"
            echo '## size after'
            git count-objects -vH
            echo '## tags after (name tagsha targetcommit)'
            git for-each-ref --format='%(refname:short) %(objectname) %(*objectname)' refs/tags | sort
          } > ../report.md
          cat ../report.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rewritten
          path: |
            rewritten.bundle
            report.md
            before.txt
            tags-before.txt
            mirror/filter-repo/commit-map
            mirror/filter-repo/ref-map
          retention-days: 1
          compression-level: 0
