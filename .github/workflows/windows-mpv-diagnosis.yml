name: Windows mpv fixture diagnosis
on:
  push:
    branches: [ci/windows-mpv-ab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-ab:
    name: Windows mpv-dev ${{ matrix.fixture }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: '2023-08-11'
            repository: media-kit/libmpv-win32-video-build
            archive: mpv-dev-x86_64-20230811-git-140ec21.7z
            algorithm: MD5
            digest: c7d1d766a6404d58a876aca403e0f53a
          - fixture: '20261002'
            repository: shinchiro/mpv-winbuild-cmake
            archive: mpv-dev-x86_64-20261002-git-3186d369f9.7z
            algorithm: SHA256
            digest: d873450cc1a7f881a8a10c33936d9555ad18a3809d827b9dbea55ba55caebcf9
    defaults:
      run:
        working-directory: media_kit
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - name: Download and verify pinned fixture
        env:
          REPOSITORY: ${{ matrix.repository }}
          FIXTURE: ${{ matrix.fixture }}
          ARCHIVE: ${{ matrix.archive }}
          ALGORITHM: ${{ matrix.algorithm }}
          DIGEST: ${{ matrix.digest }}
        run: |
          $url = "https://github.com/$env:REPOSITORY/releases/download/$env:FIXTURE/$env:ARCHIVE"
          curl.exe -fL --retry 3 $url -o $env:ARCHIVE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (Get-FileHash $env:ARCHIVE -Algorithm $env:ALGORITHM).Hash
          if ($actual -ne $env:DIGEST) { throw "Fixture checksum mismatch: $actual" }
          cmake -E tar x $env:ARCHIVE libmpv-2.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash libmpv-2.dll -Algorithm SHA256
      - run: dart pub get
      - name: Capture unpatched player-platform stack
        if: matrix.fixture == '20261002'
        run: |
          $path = 'lib/src/player/native/player/real.dart'
          (Get-Content -Raw $path).Replace('withWindowsMta(() => mpv.mpv_terminate_destroy(ctx));', 'mpv.mpv_terminate_destroy(ctx);') | Set-Content -Encoding utf8 $path
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          $dart = Join-Path $env:FLUTTER_ROOT 'bin\cache\dart-sdk\bin\dart.exe'
          & $cdb -o -g -G -c '.ecxr; k; ~* k; lm; q' $dart test test/src/player/player_test.dart --plain-name player-platform -j 1 --reporter expanded 2>&1 | Tee-Object windows-baseline-cdb.log
          git restore $path
          exit $LASTEXITCODE
      - name: Run complete suite serially
        run: |
          dart test -j 1 --reporter expanded 2>&1 | Tee-Object -FilePath windows-tests.log
          exit $LASTEXITCODE
      - name: Capture native exception if fixed suite fails
        if: failure()
        run: |
          $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cdb) { Write-Output 'cdb unavailable on runner'; exit 0 }
          $dart = Join-Path $env:FLUTTER_ROOT 'bin\cache\dart-sdk\bin\dart.exe'
          & $cdb.FullName -o -g -G -c '.ecxr; k; ~* k; lm; q' $dart test test/src/player/player_test.dart --plain-name player-platform -j 1 --reporter expanded 2>&1 | Tee-Object -FilePath windows-cdb.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-mpv-${{ matrix.fixture }}-diagnosis
          path: |
            media_kit/windows-tests.log
            media_kit/windows-cdb.log
            media_kit/windows-baseline-cdb.log
            media_kit/pubspec.lock
