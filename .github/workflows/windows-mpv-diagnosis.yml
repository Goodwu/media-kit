name: Windows mpv fixture diagnosis
on:
  push:
    branches: [ci/windows-mpv-ab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-ab:
    name: Windows mpv-dev ${{ matrix.fixture }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: '20261002'
            archive: mpv-dev-x86_64-20261002-git-3186d369f9.7z
            algorithm: SHA256
            digest: d873450cc1a7f881a8a10c33936d9555ad18a3809d827b9dbea55ba55caebcf9
    defaults:
      run:
        working-directory: media_kit
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify pinned fixture
        env:
          FIXTURE: ${{ matrix.fixture }}
          ARCHIVE: ${{ matrix.archive }}
          ALGORITHM: ${{ matrix.algorithm }}
          DIGEST: ${{ matrix.digest }}
        run: |
          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$env:FIXTURE/$env:ARCHIVE"
          curl.exe -fL --retry 3 $url -o $env:ARCHIVE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (Get-FileHash $env:ARCHIVE -Algorithm $env:ALGORITHM).Hash
          if ($actual -ne $env:DIGEST) { throw "Fixture checksum mismatch: $actual" }
          cmake -E tar x $env:ARCHIVE libmpv-2.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash libmpv-2.dll -Algorithm SHA256
      - name: Bare libmpv baseline and MTA lifetime control
        run: |
          python ../tool/windows_mpv_com_repro.py baseline 2>&1 | Tee-Object windows-baseline.log
          $baseline = $LASTEXITCODE
          Write-Output "Baseline exit: $baseline"
          python ../tool/windows_mpv_com_repro.py mta 2>&1 | Tee-Object windows-mta.log
          $fixed = $LASTEXITCODE
          Write-Output "MTA exit: $fixed"
          if ($fixed -ne 0) { exit $fixed }
      - name: Native stack for bare baseline
        if: always()
        run: |
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          $python = (Get-Command python.exe).Source
          & $cdb -g -G -c '.ecxr; k; ~* k; lm; q' $python ../tool/windows_mpv_com_repro.py baseline 2>&1 | Tee-Object windows-cdb.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-com-diagnosis
          path: media_kit/windows-*.log
