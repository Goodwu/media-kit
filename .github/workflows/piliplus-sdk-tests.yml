name: PiliPlus SDK compatibility regression

on:
  push:
    branches: ['dev']
    paths: ['media_kit/**', 'media_kit_video/**', 'tool/piliplus_compat/P1_SOURCE_STATUS.md', '.github/workflows/piliplus-sdk-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video:
    name: Complete media_kit_video suite on original app Flutter version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native API integration test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev
      - uses: actions/checkout@v4
        with:
          repository: bggRGjQaUbCoE/PiliPlus
          ref: main
          path: original-app
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: original-app/pubspec.yaml
          cache: false
      - name: Pure Dart screenshot byte contract
        working-directory: media_kit
        run: |
          dart pub get
          dart test test/src/compat/legacy_screenshot_test.dart
      - name: Resolve SDK packages
        working-directory: media_kit_video
        run: flutter pub get
      - name: Analyze the restricted-import screenshot and header contract
        working-directory: media_kit_video
        run: flutter analyze --no-pub test/piliplus_restricted_import_contract_test.dart
      - name: Full video regression (no weakening existing tests)
        working-directory: media_kit_video
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded > "$RUNNER_TEMP/video-tests.log" 2>&1
          status=$?
          tail -n 100 "$RUNNER_TEMP/video-tests.log"
          exit "$status"
      - name: Preserve full regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-video-regression-evidence
          path: ${{ runner.temp }}/video-tests.log
          if-no-files-found: warn
