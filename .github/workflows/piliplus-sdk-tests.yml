name: PiliPlus SDK compatibility regression

on:
  push:
    branches: ['compat/piliplus-zero-change-20261018']
    paths: ['media_kit/**', 'media_kit_video/**', '.github/workflows/piliplus-sdk-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video:
    name: Complete media_kit_video suite on original app Flutter version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bggRGjQaUbCoE/PiliPlus
          ref: main
          path: original-app
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: original-app/pubspec.yaml
          cache: false
      - name: Resolve SDK packages
        working-directory: media_kit_video
        run: flutter pub get
      - name: Full video regression (no weakening existing tests)
        working-directory: media_kit_video
        run: flutter test --reporter expanded
