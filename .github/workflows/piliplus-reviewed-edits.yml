name: Publish reviewed compatibility fixes
on:
  push:
    branches: ['dev']
    paths: ['tool/piliplus_compat/reviewed_edits.json', '.github/workflows/piliplus-reviewed-edits.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'Goodwu/media-kit' && github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish exact edits as actual SDK source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          python -B tool/piliplus_compat/apply_reviewed_edits.py
          git diff --check
          git diff --stat
          git diff --binary > "$RUNNER_TEMP/reviewed-edits.patch"
          git add -- media_kit media_kit_video tool/piliplus_compat docs/plans
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(compat): publish reviewed screenshot, header and build-guard corrections'
            test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
            git push origin "HEAD:$GITHUB_REF"
          fi
          echo "SDK_SOURCE_COMMIT=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-reviewed-source-patch
          path: ${{ runner.temp }}/reviewed-edits.patch
          if-no-files-found: warn
