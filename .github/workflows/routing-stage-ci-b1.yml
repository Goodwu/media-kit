name: Routing CI and B1c reviewed checkpoint
on:
  push:
    branches: [routing/MK-ROUTING-20261011]
    paths: ['.github/workflows/routing-stage-ci-b1.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply guarded task-only transformations
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tool/routing_ci/stage_ci_b1.py
          python3 -m unittest tool.routing_ci.test_android_jar_identity -v
      - name: Stage immutable tree for connector review, never update refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir stage-result
          git diff --binary > stage-result/changes.patch
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          root = 'https://api.github.com/repos/Goodwu/media-kit'
          def api(path, data=None):
              request = urllib.request.Request(root + path, data=None if data is None else json.dumps(data).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          head = os.environ['GITHUB_SHA']
          base = api('/git/commits/' + head)['tree']['sha']
          paths = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          allowed = {'media_kit_video/lib/src/hdr/hdr_route_planner.dart','media_kit_video/test/hdr_video_session_test.dart','.github/workflows/ci.yml','docs/plans/media-kit-routing-handoff-20261011.json'}
          if set(paths) != allowed:
              raise SystemExit('Unexpected staging diff: ' + str(paths))
          entries = [{'path': path, 'mode': '100644', 'type': 'blob', 'content': Path(path).read_text()} for path in paths]
          entries += [{'path': path, 'mode': '100644', 'type': 'blob', 'sha': None} for path in ['tool/routing_ci/stage_ci_b1.py','.github/workflows/routing-stage-ci-b1.yml']]
          tree = api('/git/trees', {'base_tree': base, 'tree': entries})['sha']
          Path('stage-result/tree.json').write_text(json.dumps({'head':head,'tree':tree,'paths':paths,'refsWritten':False}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: routing-ci-b1-staged-${{ github.sha }}
          path: stage-result
          if-no-files-found: error
          retention-days: 14
