name: Managed output architecture checks
on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: managed-output-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run managed-output boundary regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD 'HEAD^{tree}' > evidence/source.txt
          python3 -m unittest discover -s tool/managed_output -v 2>&1 | tee evidence/host.log
          git diff --exit-code
          printf 'scope=host-architecture-only\nnativeVerified=false\ndeviceVerified=false\n' > evidence/scope.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-output-checks-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence
          if-no-files-found: error
