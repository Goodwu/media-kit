name: Routing one-shot source repair

# Development execution only, not a substitute for validation. This job is
# never run for a pull_request and never merges or force-pushes a branch.
on:
  push:
    branches: [routing/MK-ROUTING-20261011]

permissions:
  contents: read

jobs:
  repair:
    if: >-
      github.repository == 'Goodwu/media-kit' &&
      github.ref == 'refs/heads/routing/MK-ROUTING-20261011' &&
      contains(github.event.head_commit.message, '[routing-ci-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply only the observed source repairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-repair
          git rev-parse HEAD > .ci-repair/input-sha.txt
          python3 -m unittest discover -s tool/routing_ci -v 2>&1 | tee .ci-repair/repair-tests.log
          python3 -m unittest discover -s tool/routing_native_audit -v 2>&1 | tee .ci-repair/extractor-tests.log
          python3 tool/routing_ci/repair_checks.py --root .
          (cd media_kit_video && flutter pub get && dart fix --apply --code=use_super_parameters) 2>&1 | tee .ci-repair/dart-fix.log
          python3 - <<'PY'
          import subprocess
          allowed = {
              'media_kit_video/lib/media_kit_video_controls/src/controls/cupertino.dart',
              'media_kit_video/lib/media_kit_video_controls/src/controls/material.dart',
              'media_kit_video/lib/media_kit_video_controls/src/controls/material_desktop.dart',
              'media_kit_video/lib/src/video/video_texture.dart',
              'media_kit_video/lib/src/video_controller/android_video_controller/real.dart',
              'media_kit_video/test/platform_surface_release_test.dart',
              'media_kit_video/test/hdr_output_diagnostics_test.dart',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', '--', '*.dart'], text=True).splitlines())
          if not changed or not changed <= allowed:
              raise SystemExit('Unexpected source changes: ' + repr(changed - allowed))
          subprocess.run(['git', 'add', '--', *sorted(changed)], check=True)
          PY
          git diff --cached --check
          git diff --cached > .ci-repair/source.patch
          git diff --cached --stat | tee .ci-repair/source-stat.txt
      - name: Commit to the same branch only if the remote head is unchanged
        shell: bash
        env:
          ROUTING_WRITE_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/routing-git-askpass.sh"
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s\n" x-access-token ;; *) printf "%s\n" "$ROUTING_WRITE_TOKEN" ;; esac' > "$askpass"
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          trap 'rm -f "$askpass"' EXIT
          current=$(git ls-remote origin refs/heads/routing/MK-ROUTING-20261011 | cut -f1)
          test "$current" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ci): repair observed analyzer findings and EL evidence tests [MK-ROUTING-20261011]'
          git push origin HEAD:refs/heads/routing/MK-ROUTING-20261011
          git rev-parse HEAD | tee .ci-repair/committed-sha.txt
          printf '%s\n' 'Source persisted. Independent CI on this new head is still required.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-repair-${{ github.sha }}
          path: .ci-repair
          if-no-files-found: error
