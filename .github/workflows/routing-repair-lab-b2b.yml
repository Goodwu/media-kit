name: Apply guarded B2b lab compatibility repair
on:
  push:
    branches: [routing/MK-ROUTING-20261011]
    paths: ['.github/workflows/routing-repair-lab-b2b.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply only the reviewed fixture and formatting repairs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/routing/MK-ROUTING-20261011 | cut -f1)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 4d8407b9158fa420316581d4f24f5a01591cfa5d HEAD
          python3 - <<'PY'
          import pathlib, subprocess, tempfile
          probe = pathlib.Path('media_kit_hdr_lab/lib/common/android_service_probe.dart')
          text = probe.read_text()
          assert text.count('        HdrCapabilities,\n') == 1
          probe.write_text(text.replace('        HdrCapabilities,\n', '', 1))
          fake = pathlib.Path('media_kit_hdr_lab/test/android_native_dv_session_foreign_ownership_test.dart')
          text = fake.read_text()
          old = '{HdrSourceDescriptor? hint, bool play = true, Duration? start}) async {'
          assert text.count(old) == 1
          new = '{HdrSourceDescriptor? hint, VideoSourceSpec? sourceSpec, VideoOutputTarget? target, bool play = true, Duration? start}) async {'
          fake.write_text(text.replace(old, new, 1))
          page = pathlib.Path('media_kit_hdr_lab/lib/tests/01.single_player_single_video.dart')
          original = subprocess.check_output(['git', 'show', '43415b4955e55f9785a7ef32b4b3261181d7fd9d:' + str(page)], text=True)
          assert original.count('HdrCapabilities.query()') == 1
          assert original.count('HdrCapabilities.query(player: player)') == 2
          replacement = '(await VideoRouteCapabilities.query(\n        target: const VideoOutputTarget.applicationView())).hdr'
          candidate = original.replace('await HdrCapabilities.query()', replacement).replace('await HdrCapabilities.query(player: player)', replacement)
          # Prove this is precisely the current page modulo dart format, not
          # an old-source rollback. Only this file's unrelated formatting is
          # restored so existing source-bound lifecycle assertions stay intact.
          with tempfile.TemporaryDirectory() as directory:
              formatted = pathlib.Path(directory) / 'page.dart'
              formatted.write_text(candidate)
              subprocess.run(['dart', 'format', str(formatted)], check=True)
              assert formatted.read_text() == page.read_text(), 'Page changed beyond reviewed query migration/formatting'
          page.write_text(candidate)
          assert 'HdrCapabilities.query(' not in candidate
          subprocess.run(['git', 'add', '--', str(probe), str(fake), str(page)], check=True)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(lab): finish Session query fixture migration and preserve page contracts [MK-ROUTING-20261011 B2b]'
          test "$(git ls-remote origin refs/heads/routing/MK-ROUTING-20261011 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/routing/MK-ROUTING-20261011
