name: Build OHOS unsigned HAP

on:
  pull_request:
    branches:
      - ohos
      - integration/piliplusx-hdr-08b
  push:
    branches:
      - integration/piliplusx-hdr-08b
  workflow_dispatch:

concurrency:
  group: media-kit-ohos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ohos:
    name: OHOS arm64 unsigned HAP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
          fetch-depth: 0
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y curl unzip xz-utils zip libglu1-mesa python3
        working-directory: .
      - name: Set up HarmonyOS toolchain
        uses: ErBWs/setup-ohos@5c8e74d05fc9888a387b6154ba06d0cd9ede3da1
        with:
          version: 6.0.0.858
          cache: true
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter OHOS
        run: |
          git clone https://gitcode.com/openharmony-tpc/flutter_flutter.git "$RUNNER_TEMP/flutter-ohos"
          git -C "$RUNNER_TEMP/flutter-ohos" checkout --detach 3162ec7f729abb51993cf1006be9b489c0e5c5dc
          echo "$RUNNER_TEMP/flutter-ohos/bin" >> "$GITHUB_PATH"
        working-directory: .
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build unsigned HAP
        run: |
          set -euo pipefail
          grep -F '"enableSignTask": false' ohos/hvigor/hvigor-config.json5
          flutter build hap --release
      - name: Verify HAP is unsigned and arm64
        run: |
          set -euo pipefail
          hap=$(find ohos/entry/build -type f -name '*unsigned.hap' -print -quit)
          test -n "$hap"
          unzip -l "$hap" | grep -E '(^|/)libs/arm64-v8a/'
      - name: Generate OHOS release metadata
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          FLUTTER_OHOS_COMMIT: 3162ec7f729abb51993cf1006be9b489c0e5c5dc
          SETUP_OHOS_COMMIT: 5c8e74d05fc9888a387b6154ba06d0cd9ede3da1
          OHOS_CLI_VERSION: 6.0.0.858
        run: |
          set -euo pipefail
          hap=$(find ohos/entry/build -type f -name '*unsigned.hap' -print -quit)
          mkdir -p release-metadata
          cp "$hap" release-metadata/
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          files = sorted(Path('release-metadata').glob('*.hap'))
          if len(files) != 1:
              raise SystemExit('expected exactly one unsigned HAP')
          path = files[0]
          manifest = {
              'schema': 1,
              'source_commit': os.environ['SOURCE_COMMIT'],
              'workflow_run_id': int(os.environ['RUN_ID']),
              'flutter_ohos_commit': os.environ['FLUTTER_OHOS_COMMIT'],
              'setup_ohos_commit': os.environ['SETUP_OHOS_COMMIT'],
              'ohos_cli_version': os.environ['OHOS_CLI_VERSION'],
              'platform': 'ohos',
              'abi': 'arm64-v8a',
              'hdr_backend': 'texture-tone-map',
              'artifacts': [{
                  'file': path.name,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              }],
          }
          Path('release-metadata/manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          (cd release-metadata && sha256sum *.hap manifest.json > SHA256SUMS)
          cat release-metadata/manifest.json
          cat release-metadata/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: media-kit-ohos-arm64-unsigned
          path: media_kit_test/release-metadata
