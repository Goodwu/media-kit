name: Materialize reviewed B2a query checkpoint

on:
  push:
    branches: [routing/MK-ROUTING-20261011]
    paths: [.github/workflows/routing-query-stage.yml]

permissions:
  contents: read

jobs:
  materialize:
    if: github.repository == 'Goodwu/media-kit' && github.ref == 'refs/heads/routing/MK-ROUTING-20261011' && contains(github.event.head_commit.message, '[MK-ROUTING-20261011 B2a-stage]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply reviewed bounded patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/routing/MK-ROUTING-20261011 | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, re, subprocess
          from pathlib import Path
          encoded=''.join(Path(f'tool/routing_ci/b2a-stage/part{i}').read_text() for i in range(6))
          if len(encoded)!=21724: raise SystemExit('Invalid transport length')
          decoder=lzma.LZMADecompressor(memlimit=256*1024*1024)
          patch=decoder.decompress(base64.b64decode(encoded,validate=True),max_length=2*1024*1024)
          if not decoder.eof or decoder.unused_data: raise SystemExit('Invalid transport stream')
          if hashlib.sha256(patch).hexdigest()!='910e00cfe5878e59aa524dbad166dd66818e39c09443cd9020235f478f827dd2': raise SystemExit('Patch hash mismatch')
          expected={'.github/workflows/routing-source.yml','media_kit_video/lib/media_kit_video.dart','media_kit_video/test/video_route_capabilities_test.dart','tool/routing_query/test_android_query.py'}
          expected.update('media_kit_video/lib/src/routing/'+n+'.dart' for n in ['video_output_target','video_source_spec','video_route_capabilities'])
          expected.update('media_kit_video/android/src/main/java/com/alexmercerind/media_kit_video/'+n+'.java' for n in ['HdrCapabilities','MediaKitVideoPlugin','VideoRouteCapabilities','VideoSourceSpec'])
          pairs=re.findall(r'^diff --git a/(\S+) b/(\S+)$',patch.decode(),re.M)
          if any(a!=b for a,b in pairs) or {b for a,b in pairs}!=expected: raise SystemExit('Unexpected paths')
          Path('/tmp/b2a.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/b2a.patch'],check=True)
          subprocess.run(['git','apply','/tmp/b2a.patch'],check=True)
          # Workflow changes use the separately authorized connector, not the
          # runner token. Restore only the reviewed one-line CI patch here.
          subprocess.run(['git','restore','--','.github/workflows/routing-source.yml'],check=True)
          expected.remove('.github/workflows/routing-source.yml')
          Path('/tmp/b2a-allowed.json').write_text(json.dumps(sorted(expected)))
          PY
          python3 tool/routing_query/test_android_query.py
      - name: Format only the reviewed new Dart source
        working-directory: media_kit_video
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart fix --apply --code=curly_braces_in_flow_control_structures
          dart format lib/src/routing lib/media_kit_video.dart test/video_route_capabilities_test.dart
      - name: Commit source on the existing branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          allowed=set(json.loads(Path('/tmp/b2a-allowed.json').read_text()))
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          new=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          if 'media_kit_video/pubspec.lock' in changed:
              subprocess.run(['git','restore','--','media_kit_video/pubspec.lock'],check=True)
              changed.remove('media_kit_video/pubspec.lock')
          if (changed|new)-allowed: raise SystemExit('Out-of-scope changes: '+repr((changed|new)-allowed))
          p=Path('docs/plans/media-kit-routing-handoff-20261011.json')
          d=json.loads(p.read_text()); d['planCommit']='6107617628199ec64a44581126fd488ea201af0f'; d['planVersion']=3
          d['canonicalDevelopment']['piliPlusX'].update(branch='routing/MK-ROUTING-20261011',branchState='created',pullRequest=1,observedSourceCommit='8fc8f2c618b96b60b29d576e4242d0e153fd00bd',note='Existing PR1; do not recreate. Result comments6100836133/6100840179 record231 Python/156 Flutter and bundle success, analyzer still red.')
          for t in d['tasks']:
              if t['id']=='B2': t.update(status='in_progress',note='New query implemented, original Player query callers and Session/App migration still pending.',subtasks=[{'id':'B2a-query','status':'implemented','commitAnchor':'feat(video): add target-aware source-spec capability query [MK-ROUTING-20261011 B2a]','hostJavaAssertionsPassed':34,'independentFlutterAndAndroidCI':'pending','doNotRepeat':True},{'id':'B2b-query-migration-App-source-filter','status':'planned'},{'id':'B2c-LG-managed-output','status':'planned'}])
              if t['id']=='APP': t.update(status='in_progress',note='Existing PR1 source integration/test/bundle implemented; new query/DASH filter pending.')
          d['nextAction']='Read resulting B2a commit, retire temporary workflows via authorized connector and add host query test to source CI; validate independently. Then migrate Session/lab/App query and actual DASH filtering on the same two branches. Retain remaining B1/B3/LG/config work.'
          d['lastCheckpoint']='B2a code persisted after34 current-Java host assertions. First runner push failed because workflow changes require a different permission; retry changes source only. Independent Flutter/Android/native/device validation not yet claimed. Patch transport is removed; workflow retirement is separate.'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git rm -r tool/routing_ci/b2a-stage
          git add docs/plans/media-kit-routing-handoff-20261011.json media_kit_video/android/src/main/java/com/alexmercerind/media_kit_video media_kit_video/lib/media_kit_video.dart media_kit_video/lib/src/routing media_kit_video/test/video_route_capabilities_test.dart tool/routing_query
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/routing/MK-ROUTING-20261011 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(video): add target-aware source-spec capability query [MK-ROUTING-20261011 B2a]'
          git push origin HEAD:refs/heads/routing/MK-ROUTING-20261011
          mkdir ci-b2a-results
          git rev-parse HEAD > ci-b2a-results/head.txt
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          paths=json.loads(Path('/tmp/b2a-allowed.json').read_text())+['docs/plans/media-kit-routing-handoff-20261011.json']
          with zipfile.ZipFile('ci-b2a-results/source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in paths: z.write(p,p)
          PY
          printf '%s\n' 'Source checkpoint, not independent CI acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: b2a-materialized-source-${{ github.sha }}
          path: ci-b2a-results
          if-no-files-found: error
