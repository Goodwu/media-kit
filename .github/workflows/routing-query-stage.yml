name: Materialize reviewed B2a query checkpoint

on:
  push:
    branches: [routing/MK-ROUTING-20261011]
    paths: [.github/workflows/routing-query-stage.yml]

permissions:
  contents: read

jobs:
  materialize:
    if: github.repository == 'Goodwu/media-kit' && github.ref == 'refs/heads/routing/MK-ROUTING-20261011' && contains(github.event.head_commit.message, '[MK-ROUTING-20261011 B2a-stage]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply the reviewed bounded patch and check scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/routing/MK-ROUTING-20261011 | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, re, subprocess
          from pathlib import Path
          encoded = ''.join(Path(f'tool/routing_ci/b2a-stage/part{i}').read_text() for i in range(6))
          if len(encoded) != 21724: raise SystemExit('Invalid patch transport length')
          decoder = lzma.LZMADecompressor(memlimit=256*1024*1024)
          patch = decoder.decompress(base64.b64decode(encoded, validate=True), max_length=2*1024*1024)
          if not decoder.eof or decoder.unused_data: raise SystemExit('Invalid patch transport stream')
          if hashlib.sha256(patch).hexdigest() != '910e00cfe5878e59aa524dbad166dd66818e39c09443cd9020235f478f827dd2': raise SystemExit('Patch hash mismatch')
          expected = {
              '.github/workflows/routing-source.yml',
              'media_kit_video/android/src/main/java/com/alexmercerind/media_kit_video/HdrCapabilities.java',
              'media_kit_video/android/src/main/java/com/alexmercerind/media_kit_video/MediaKitVideoPlugin.java',
              'media_kit_video/android/src/main/java/com/alexmercerind/media_kit_video/VideoRouteCapabilities.java',
              'media_kit_video/android/src/main/java/com/alexmercerind/media_kit_video/VideoSourceSpec.java',
              'media_kit_video/lib/media_kit_video.dart',
              'media_kit_video/lib/src/routing/video_output_target.dart',
              'media_kit_video/lib/src/routing/video_route_capabilities.dart',
              'media_kit_video/lib/src/routing/video_source_spec.dart',
              'media_kit_video/test/video_route_capabilities_test.dart',
              'tool/routing_query/test_android_query.py',
          }
          pairs = re.findall(r'^diff --git a/(\S+) b/(\S+)$', patch.decode(), re.M)
          if any(a != b for a,b in pairs) or {b for a,b in pairs} != expected: raise SystemExit('Unexpected patch paths')
          Path('/tmp/b2a.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/b2a.patch'], check=True)
          subprocess.run(['git','apply','/tmp/b2a.patch'], check=True)
          Path('/tmp/b2a-allowed.json').write_text(json.dumps(sorted(expected)))
          PY
          python3 tool/routing_query/test_android_query.py
      - name: Format reviewed new Dart source with the current SDK
        working-directory: media_kit_video
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart fix --apply --code=curly_braces_in_flow_control_structures
          dart format lib/src/routing lib/media_kit_video.dart test/video_route_capabilities_test.dart
      - name: Persist source and retire this write workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          allowed=set(json.loads(Path('/tmp/b2a-allowed.json').read_text()))
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          new=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          # pub get may update only the lockfile in the isolated preparation;
          # it is not an implementation change. Restore that known file only.
          if 'media_kit_video/pubspec.lock' in changed:
              subprocess.run(['git','restore','--','media_kit_video/pubspec.lock'],check=True)
              changed.remove('media_kit_video/pubspec.lock')
          if (changed|new)-allowed: raise SystemExit('Formatter wrote outside approved paths: '+repr((changed|new)-allowed))
          p=Path('docs/plans/media-kit-routing-handoff-20261011.json')
          ledger=json.loads(p.read_text())
          ledger['planCommit']='6107617628199ec64a44581126fd488ea201af0f'
          ledger['planVersion']=3
          ledger['canonicalDevelopment']['piliPlusX'].update(branch='routing/MK-ROUTING-20261011',branchState='created',pullRequest=1,observedSourceCommit='8fc8f2c618b96b60b29d576e4242d0e153fd00bd',note='Existing App chain; do not recreate. Read PR1 comments6100836133 and central6100840179 for231 Python/156 Flutter and bundle results.')
          for task in ledger['tasks']:
              if task['id']=='B2':
                  task.update(status='in_progress',note='New target/source query implemented; old Player query callers and Session/App migration are NOT yet complete.',subtasks=[{'id':'B2a-query','status':'implemented','commitAnchor':'feat(video): add target-aware source-spec capability query [MK-ROUTING-20261011 B2a]','localTests':{'wholeNewJavaFilesWithHostFixtures':34,'passed':True,'fullAndroidBuild':False},'flutterTests':'independent_ci_pending','doNotRepeat':True},{'id':'B2b-query-migration-and-App-source-filter','status':'planned'},{'id':'B2c-LG-managed-output','status':'planned'}])
              if task['id']=='APP': task.update(status='in_progress',note='Existing PR1 source integration and host tests/bundle already implemented; new source-spec filter and query migration still required.')
          ledger['nextAction']='Verify actual B2a source commit on PR4, run independent latest-head source and Android compile CI, fix failures without reimplementing. Then migrate Player-free query in Session/lab/PiliPlusX and filter actual DASH specs on existing App PR1. Retain B1/B3/LG/advanced-options remaining tasks.'
          ledger['lastCheckpoint']='Reviewed B2a patch materialized and Dart-formatted on current SDK;34 host Java assertions passed. This source-writing job is not independent Flutter/Android/native/device acceptance. Original query callers still exist. Source transport and write workflows retired in this source commit.'
          p.write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          PY
          git rm -r tool/routing_ci/b2a-stage .github/workflows/routing-query-stage.yml .github/workflows/routing-source-snapshot.yml
          git add .github/workflows/routing-source.yml docs/plans/media-kit-routing-handoff-20261011.json media_kit_video/android/src/main/java/com/alexmercerind/media_kit_video media_kit_video/lib/media_kit_video.dart media_kit_video/lib/src/routing media_kit_video/test/video_route_capabilities_test.dart tool/routing_query
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/routing/MK-ROUTING-20261011 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(video): add target-aware source-spec capability query [MK-ROUTING-20261011 B2a]'
          git push origin HEAD:refs/heads/routing/MK-ROUTING-20261011
          git rev-parse HEAD
          printf '%s\n' 'Source checkpoint only; trigger independent validation on this result head.' >> "$GITHUB_STEP_SUMMARY"
