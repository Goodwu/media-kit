name: Materialize reviewed compatibility patch

on:
  push:
    branches: ['compat/piliplus-zero-change-20261018']
    paths: ['tool/piliplus_compat/reviewed_patch.json']

# Creates unattached Git objects only. This workflow never moves a branch.
# Publishing requires a separate expected-head update through the review client.
permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact before/after blobs and create an unpublished commit
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed-patch'
          out.mkdir()
          def git(*args):
              return subprocess.check_output(['git', '-C', str(root), *args])
          request_path = root / 'tool/piliplus_compat/reviewed_patch.json'
          request_bytes = request_path.read_bytes()
          req = json.loads(request_bytes)
          head = git('rev-parse', 'HEAD').decode().strip()
          assert os.environ['GITHUB_REPOSITORY'] == 'Goodwu/media-kit'
          assert os.environ['GITHUB_REF'] == 'refs/heads/compat/piliplus-zero-change-20261018'
          assert req['schemaVersion'] == 1
          assert git('rev-parse', 'HEAD^').decode().strip() == req['baseCommit']
          assert isinstance(req['message'], str) and len(req['message']) < 10000
          allowed = ('media_kit/', 'media_kit_video/', 'libs/', 'tool/piliplus_compat/', 'docs/plans/piliplus-zero-change')
          protected = {'tool/piliplus_compat/reviewed_patch.json', '.github/workflows/piliplus-reviewed-patch.yml'}
          for path, spec in req['files'].items():
              assert path not in protected and (path.startswith(allowed) or path in {'.github/workflows/piliplus-sdk-tests.yml', '.github/workflows/piliplus-original-build.yml'})
              assert not path.startswith('/') and '\\' not in path and '..' not in pathlib.PurePosixPath(path).parts and '.git' not in pathlib.PurePosixPath(path).parts
              assert spec['mode'] in ('100644', '100755')
              result = subprocess.run(['git', '-C', str(root), 'rev-parse', '--verify', 'HEAD:' + path], capture_output=True)
              before = result.stdout.decode().strip() if result.returncode == 0 else None
              assert before == spec['before'], (path, 'before mismatch')
          patch = out / 'reviewed.patch'
          patch.write_text(req['patch'], encoding='utf-8')
          subprocess.run(['git', '-C', str(root), 'apply', '--check', '--index', str(patch)], check=True)
          subprocess.run(['git', '-C', str(root), 'apply', '--index', str(patch)], check=True)
          changed = set(git('diff', '--cached', '--name-only', '-z').decode().strip('\0').split('\0'))
          assert changed == set(req['files'])
          tree = []
          for path, spec in req['files'].items():
              if spec['after'] is None:
                  assert not (root / path).exists()
                  tree.append({'path': path, 'mode': spec['mode'], 'type': 'blob', 'sha': None})
                  continue
              p = root / path
              assert p.is_file() and not p.is_symlink()
              data = p.read_bytes()
              sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert sha == spec['after'], (path, 'after mismatch')
              assert git('ls-files', '-s', '--', path).decode().split()[0] == spec['mode']
              tree.append({'path': path, 'mode': spec['mode'], 'type': 'blob', 'content': data.decode('utf-8')})
          def post(endpoint, payload):
              url = 'https://api.github.com/repos/Goodwu/media-kit/git/' + endpoint
              request = urllib.request.Request(url, data=json.dumps(payload).encode(), method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          built_tree = post('trees', {'base_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(), 'tree': tree})
          commit = post('commits', {'message': req['message'], 'tree': built_tree['sha'], 'parents': [head]})
          receipt = {'schemaVersion': 1, 'status': 'objects-created-not-published', 'expectedHead': head,
                     'candidateCommit': commit['sha'], 'candidateTree': built_tree['sha'],
                     'requestSha256': hashlib.sha256(request_bytes).hexdigest(), 'files': req['files']}
          (out / 'publication-candidate.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-compatibility-patch-candidate
          path: ${{ runner.temp }}/reviewed-patch/*
          if-no-files-found: error
