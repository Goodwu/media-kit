name: OHOS complete PiliPlus media integration

on:
  # Manual-only: Goodwu/PiliPlus feature/ohos is currently absent.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete-application:
    name: Confirmed Goodwu/PiliPlus feature/ohos with this SDK commit
    uses: Goodwu/PiliPlus/.github/workflows/ohos-build.yml@feature/ohos
    with:
      application_ref: feature/ohos
      media_kit_ref: ${{ github.sha }}

# This supersedes the preflight of bggRGjQaUbCoE/PiliPlus main, which was the
# wrong application for the user's confirmed target. The called workflow
# retains source/patch/dependency/parser/UI/analysis/HAP/native-identity gates,
# compiles fresh OHOS native sources and builds actual lib/main.dart. It is
# stronger than the earlier SDK exercise and is never device/HDR certification.
# Historical failed preflight and successful SDK-only evidence remain in docs.
