name: Materialize reviewed B2b checkpoint
on:
  push:
    branches: [routing/MK-ROUTING-20261011]
    paths: ['.github/workflows/routing-materialize-b2b.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify and apply this exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/routing/MK-ROUTING-20261011 | cut -f1)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 43415b4955e55f9785a7ef32b4b3261181d7fd9d HEAD
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          root = pathlib.Path('tool/routing_ci/query-migration-transport')
          patch = lzma.decompress(base64.b64decode(''.join((root / f'part{i}.b64').read_text() for i in (1, 2, 3)), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '96e3b84c2b789c6142b5daa58168ba411eb289895a917102199f9c3be1bd232b'
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert len(paths) == 14
          assert all(p.startswith(('media_kit_video/', 'media_kit_hdr_lab/')) or p == 'docs/plans/media-kit-routing-handoff-20261011.json' for p in paths)
          dart = [p for p in paths if p.endswith('.dart')]
          subprocess.run(['dart', 'format', *dart], check=True)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          git diff --cached --check
          git rm tool/routing_ci/query-migration-transport/part*.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(routing): migrate query and enforce exact source support [MK-ROUTING-20261011 B2b]'
          test "$(git ls-remote origin refs/heads/routing/MK-ROUTING-20261011 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/routing/MK-ROUTING-20261011
