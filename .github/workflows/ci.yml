name: Github Actions
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      run_package_tests:
        description: Run the long media_kit package test suites
        required: false
        default: false
        type: boolean

concurrency:
  group: media-kit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media_kit-tests-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_package_tests == true }}
    name: package:media_kit tests (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: media_kit
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true

      - name: Setup libmpv for Windows
        run: |
          curl -LO https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261002/mpv-dev-x86_64-20261002-git-3186d369f9.7z
          cmake -E sha256sum mpv-dev-x86_64-20261002-git-3186d369f9.7z | find /i "d873450cc1a7f881a8a10c33936d9555ad18a3809d827b9dbea55ba55caebcf9" > nul || exit 1
          cmake -E tar x mpv-dev-x86_64-20261002-git-3186d369f9.7z libmpv-2.dll
        shell: cmd

      - run: dart pub get
      - run: dart test -j 1 --reporter expanded

  media_kit-tests-linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_package_tests == true }}
    name: package:media_kit tests (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_kit
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - run: sudo apt-get update
      - run: sudo apt-get install clang cmake ninja-build pkg-config libgtk-3-dev mpv libmpv-dev dpkg-dev p7zip-full p7zip-rar
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - run: dart pub get
      - run: dart test

  media_kit-tests-macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_package_tests == true }}
    name: package:media_kit tests (macOS)
    runs-on: macos-latest
    env:
      LIBMPV_LIBRARY_PATH: ${{ format('{0}/{1}', github.workspace, 'media_kit/test/ci/macos/libs/libmpv.dylib') }}
    defaults:
      run:
        working-directory: media_kit
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - run: sh test/ci/macos/scripts/setup_dylibs.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - run: dart pub get
      - run: dart test

  media_kit-tests-web:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_package_tests == true }}
    name: package:media_kit tests (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_kit
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - run: sudo apt-get update
      - run: sudo apt-get install clang cmake ninja-build pkg-config libgtk-3-dev mpv libmpv-dev dpkg-dev p7zip-full p7zip-rar
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      # Delete tests which import native code & depend upon dart:ffi
      - run: rm -r test/src/player/native
      - run: dart pub get
      - run: dart test --platform chrome
      

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --verbose
      - run: cmake -E tar "cfv" "media_kit_test_win32_x64.7z" --format=7zip "build\windows\x64\runner\Release"
      - uses: actions/upload-artifact@v4
        with:
          name: media_kit_test_win32_x64
          path: media_kit_test/media_kit_test_win32_x64.7z
      # The "vnext" draft-release automation is upstream-only: this fork's
      # GITHUB_TOKEN stays read-only and its releases are published manually.
      - uses: softprops/action-gh-release@v2
        if: github.repository == 'media-kit/media-kit' && github.ref == 'refs/heads/main'
        with:
          draft: true
          prerelease: false
          tag_name: "vnext"
          files: |
            media_kit_test/media_kit_test_win32_x64.7z

  windows-arm64:
    name: Windows ARM64
    runs-on: windows-11-arm
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: "true"
      - name: Set up Flutter for ARM64
        shell: pwsh
        run: |
          $flutterPath = Join-Path $env:RUNNER_TEMP "flutter"
          New-Item -ItemType Directory -Force -Path $flutterPath | Out-Null
          git -C $flutterPath init
          git -C $flutterPath remote add origin https://github.com/flutter/flutter.git
          git -C $flutterPath fetch --depth 1 origin d3b14c876900e553bc736ca19295fc09e3853e8e
          git -C $flutterPath checkout --detach FETCH_HEAD
          git -C $flutterPath tag -f 3.47.2 FETCH_HEAD
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $flutterPath "bin")
          & (Join-Path $flutterPath "bin\flutter.bat") --version
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --verbose
      - run: cmake -E tar "cfv" "media_kit_test_win32_arm64.7z" --format=7zip "build\windows\arm64\runner\Release"
      - uses: actions/upload-artifact@v4
        with:
          name: media_kit_test_win32_arm64
          path: media_kit_test/media_kit_test_win32_arm64.7z
      - uses: softprops/action-gh-release@v1
        if: github.repository == 'media-kit/media-kit' && github.ref == 'refs/heads/main'
        with:
          draft: true
          prerelease: false
          tag_name: "vnext"
          files: |
            media_kit_test/media_kit_test_win32_arm64.7z

  linux:
    name: Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - run: sudo apt-get update
      - run: sudo apt-get install clang cmake ninja-build pkg-config libgtk-3-dev mpv libmpv-dev dpkg-dev p7zip-full p7zip-rar
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - name: Resolve Flutter packages with transient retry
        run: |
          for attempt in 1 2 3; do
            if flutter pub get --enforce-lockfile; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - run: flutter build linux --verbose
      - run: 7z a media_kit_test_linux_x64.7z build/linux/x64/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: media_kit_test_linux_x64
          path: media_kit_test/media_kit_test_linux_x64.7z
      - uses: softprops/action-gh-release@v2
        if: github.repository == 'media-kit/media-kit' && github.ref == 'refs/heads/main'
        with:
          draft: true
          prerelease: false
          tag_name: "vnext"
          files: |
            media_kit_test/media_kit_test_linux_x64.7z

  macos:
    name: macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build macos --verbose
      - run: 7z a media_kit_test_macos_universal.7z build/macos/Build/Products/Release/media_kit_test.app
      - uses: actions/upload-artifact@v4
        with:
          name: media_kit_test_macos_universal
          path: media_kit_test/media_kit_test_macos_universal.7z
      - uses: softprops/action-gh-release@v2
        if: github.repository == 'media-kit/media-kit' && github.ref == 'refs/heads/main'
        with:
          draft: true
          prerelease: false
          tag_name: "vnext"
          files: |
            media_kit_test/media_kit_test_macos_universal.7z

  ios:
    name: iOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --verbose --no-codesign
      - run: 7z a media_kit_test_ios_arm64.7z build/ios/iphoneos/Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: media_kit_test_ios_arm64
          path: media_kit_test/media_kit_test_ios_arm64.7z
      - uses: softprops/action-gh-release@v2
        if: github.repository == 'media-kit/media-kit' && github.ref == 'refs/heads/main'
        with:
          draft: true
          prerelease: false
          tag_name: "vnext"
          files: |
            media_kit_test/media_kit_test_ios_arm64.7z

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
            distribution: 'zulu'
            java-version: '17'
            # cache: 'gradle'
            # check-latest: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --split-per-abi --verbose
      - run: |
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/media_kit_test_android-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/media_kit_test_android-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/media_kit_test_android-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: media_kit_test_android-armeabi-v7a
          path: media_kit_test/build/app/outputs/flutter-apk/media_kit_test_android-armeabi-v7a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: media_kit_test_android-arm64-v8a
          path: media_kit_test/build/app/outputs/flutter-apk/media_kit_test_android-arm64-v8a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: media_kit_test_android-x86_64
          path: media_kit_test/build/app/outputs/flutter-apk/media_kit_test_android-x86_64.apk
      - uses: softprops/action-gh-release@v2
        if: github.repository == 'media-kit/media-kit' && github.ref == 'refs/heads/main'
        with:
          draft: true
          prerelease: false
          tag_name: "vnext"
          files: |
            media_kit_test/build/app/outputs/flutter-apk/media_kit_test_android-armeabi-v7a.apk
            media_kit_test/build/app/outputs/flutter-apk/media_kit_test_android-arm64-v8a.apk
            media_kit_test/build/app/outputs/flutter-apk/media_kit_test_android-x86_64.apk
  build_web:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_kit_test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Build Flutter Web WASM
        run: flutter build web --release --wasm

  optional-libs-windows:
    name: Windows (optional libs)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - name: Remove `media_kit_libs_*` dependencies
        run: |
          "C:\Program Files\Git\usr\bin\sed.exe" -i "/media_kit_libs_/d" pubspec.yaml
          type pubspec.yaml
          "C:\Program Files\Git\usr\bin\sed.exe" -i "/media_kit_libs_/d" pubspec_overrides.yaml
          type pubspec_overrides.yaml
        shell: cmd
      - run: flutter pub get
      - run: flutter build windows --verbose

  optional-libs-linux:
    name: Linux (optional libs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - run: sudo apt-get update
      - run: sudo apt-get install clang cmake ninja-build pkg-config libgtk-3-dev mpv libmpv-dev dpkg-dev p7zip-full p7zip-rar
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - name: Remove `media_kit_libs_*` dependencies
        run: |
          sed -i '/media_kit_libs_/d' pubspec.yaml
          cat pubspec.yaml
          sed -i '/media_kit_libs_/d' pubspec_overrides.yaml
          cat pubspec_overrides.yaml   
      - run: flutter pub get
      - run: flutter build linux --verbose

  optional-libs-macos:
    name: macOS (optional libs)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - name: Remove `media_kit_libs_*` dependencies
        run: |
          sed -i '' '/media_kit_libs_/d' pubspec.yaml
          cat pubspec.yaml
          sed -i '' '/media_kit_libs_/d' pubspec_overrides.yaml
          cat pubspec_overrides.yaml   
      - run: flutter pub get
      - run: flutter build macos --verbose

  optional-libs-ios:
    name: iOS (optional libs)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - name: Remove `media_kit_libs_*` dependencies
        run: |
          sed -i '' '/media_kit_libs_/d' pubspec.yaml
          cat pubspec.yaml
          sed -i '' '/media_kit_libs_/d' pubspec_overrides.yaml
          cat pubspec_overrides.yaml   
      - run: flutter pub get
      - run: flutter build ios --verbose --no-codesign

  optional-libs-android:
    name: Android (optional libs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
            distribution: 'zulu'
            java-version: '17'
            # cache: 'gradle'
            # check-latest: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - name: Remove `media_kit_libs_*` dependencies
        run: |
          sed -i '/media_kit_libs_/d' pubspec.yaml
          cat pubspec.yaml
          sed -i '/media_kit_libs_/d' pubspec_overrides.yaml
          cat pubspec_overrides.yaml   
      - run: flutter pub get
      - run: flutter build apk --split-per-abi --verbose

  audio-libs-windows:
    name: Windows (audio libs)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - name: Remove `media_kit_libs_*` dependencies
        run: |
          "C:\Program Files\Git\usr\bin\sed.exe" -i "s/\bmedia_kit_libs\([^[ ]*\)_video\b/media_kit_libs\1_audio/g" pubspec.yaml
          type pubspec.yaml
          "C:\Program Files\Git\usr\bin\sed.exe" -i "s/\bmedia_kit_libs\([^[ ]*\)_video\b/media_kit_libs\1_audio/g" pubspec_overrides.yaml
          pubspec_overrides.yaml
        shell: cmd
      - run: flutter pub get
      - run: flutter build windows --verbose

  audio-libs-linux:
    name: Linux (audio libs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - run: sudo apt-get update
      - run: sudo apt-get install clang cmake ninja-build pkg-config libgtk-3-dev mpv libmpv-dev dpkg-dev p7zip-full p7zip-rar
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - name: Remove `media_kit_libs_*` dependencies
        run: |
          sed -i 's/\bmedia_kit_libs\([^[ ]*\)_video\b/media_kit_libs\1_audio/g' pubspec.yaml
          cat pubspec.yaml
          sed -i 's/\bmedia_kit_libs\([^[ ]*\)_video\b/media_kit_libs\1_audio/g' pubspec_overrides.yaml
          cat pubspec_overrides.yaml
      - run: flutter pub get
      - run: flutter build linux --verbose

  audio-libs-macos:
    name: macOS (audio libs)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - name: Remove `media_kit_libs_*` dependencies
        run: |
          sed -i '' 's/\bmedia_kit_libs\([^[ ]*\)_video\b/media_kit_libs\1_audio/g' pubspec.yaml
          cat pubspec.yaml
          sed -i '' 's/\bmedia_kit_libs\([^[ ]*\)_video\b/media_kit_libs\1_audio/g' pubspec_overrides.yaml
          cat pubspec_overrides.yaml
      - run: flutter pub get
      - run: flutter build macos --verbose

  audio-libs-ios:
    name: iOS (audio libs)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - name: Remove `media_kit_libs_*` dependencies
        run: |
          sed -i '' 's/\bmedia_kit_libs\([^[ ]*\)_video\b/media_kit_libs\1_audio/g' pubspec.yaml
          cat pubspec.yaml
          sed -i '' 's/\bmedia_kit_libs\([^[ ]*\)_video\b/media_kit_libs\1_audio/g' pubspec_overrides.yaml
          cat pubspec_overrides.yaml
      - run: flutter pub get
      - run: flutter build ios --verbose --no-codesign

  audio-libs-android:
    name: Android (audio libs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_kit_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
            distribution: 'zulu'
            java-version: '17'
            # cache: 'gradle'
            # check-latest: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true
      - name: Remove `media_kit_libs_*` dependencies
        run: |
          sed -i 's/\bmedia_kit_libs\([^[ ]*\)_video\b/media_kit_libs\1_audio/g' pubspec.yaml
          cat pubspec.yaml
          sed -i 's/\bmedia_kit_libs\([^[ ]*\)_video\b/media_kit_libs\1_audio/g' pubspec_overrides.yaml
          cat pubspec_overrides.yaml

      - run: flutter pub get
      - run: flutter build apk --split-per-abi --verbose

  release-metadata:
    name: Release manifest and checksums
    # Upstream-only "vnext" release metadata: the fork's GITHUB_TOKEN stays
    # read-only and its releases are published manually.
    if: github.repository == 'media-kit/media-kit' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - windows
      - windows-arm64
      - linux
      - macos
      - ios
      - android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate release metadata
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find artifacts -type f -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No build artifacts were downloaded' >&2
            exit 1
          fi
          sha256sum "${files[@]}" | sed 's#  artifacts/##' > SHA256SUMS
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('artifacts')
          entries = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              data = path.read_bytes()
              name = path.name
              lower = name.lower()
              if 'android' in lower:
                  platform = 'android'
              elif 'ios' in lower:
                  platform = 'ios'
              elif 'macos' in lower:
                  platform = 'macos'
              elif 'linux' in lower:
                  platform = 'linux'
              elif 'win' in lower:
                  platform = 'windows'
              else:
                  platform = 'unknown'
              if 'arm64' in lower or 'arm-v8a' in lower:
                  abi = 'arm64'
              elif 'armeabi-v7a' in lower:
                  abi = 'armeabi-v7a'
              elif 'x86_64' in lower or 'x64' in lower:
                  abi = 'x86_64'
              elif 'universal' in lower:
                  abi = 'universal'
              else:
                  abi = 'unspecified'
              entries.append({
                  'file': str(path.relative_to(root)),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'platform': platform,
                  'abi': abi,
              })
          manifest = {
              'schema': 1,
              'source_commit': os.environ['SOURCE_COMMIT'],
              'workflow_run_id': int(os.environ['RUN_ID']),
              'workflow_run_attempt': int(os.environ['RUN_ATTEMPT']),
              'artifacts': entries,
          }
          Path('manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          sha256sum manifest.json >> SHA256SUMS
          cat manifest.json
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: media-kit-release-metadata
          path: |
            manifest.json
            SHA256SUMS
      - uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: false
          tag_name: "vnext"
          files: |
            manifest.json
            SHA256SUMS

  libmpv-jar-identity:
    # The default arm64 libmpv jar must carry the fork's validated fixes.
    # Parses the pinned URL + SHA-256 out of the libs build.gradle, then
    # verifies the downloaded jar contains the expected version markers
    # inside libmpv.so (see the libmpv build lock in that package's
    # CHANGELOG.md).
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_package_tests == true }}
    name: libmpv jar identity (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned arm64 jar and verify identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import re
          import subprocess
          import zipfile
          from pathlib import Path

          gradle = Path(
              'libs/android/media_kit_libs_android_video/android/build.gradle'
          ).read_text()
          match = re.search(
              r'"url":\s*"([^"]*arm64-v8a\.jar)",\s*'
              r'"sha256":\s*"([0-9a-f]{64})"',
              gradle,
          )
          if match is None:
              raise SystemExit('no pinned arm64-v8a jar found in build.gradle')
          url, expected = match.groups()
          print(f'pinned url: {url}')
          print(f'pinned sha256: {expected}')

          jar = Path('arm64-v8a.jar')
          subprocess.run(['curl', '-fsSL', url, '-o', str(jar)], check=True)
          actual = hashlib.sha256(jar.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'sha256 mismatch: {actual} != {expected}')

          with zipfile.ZipFile(jar) as archive:
              so = archive.read('lib/arm64-v8a/libmpv.so')
          # Version markers compiled into the fork's libmpv. Since the
          # architecture-review remediation (5f9ddf1777): the mapper's
          # per-mapper init/fallback log, the dovi rescale factor log and
          # the --dovi-p5-fast-path option name. Since the HDR-routing
          # property generation (d24c59905b, release v2026.011): the
          # dovi-p5-pipeline read-only build-capability property, probed
          # through the media_kit_video_hdr_bridge disposable-instance
          # probe (the option-info proxy is retired).
          # (The old P5_DOVI_RESCALE / P5_BUFFER_RETIRE probe tags were
          # removed together with the experiment probes.)
          markers = [b'P5 direct external YUV sampler enabled', b'dovi rescale k=%.6f', b'dovi-p5-fast-path', b'dovi-p5-pipeline']
          missing = [m.decode() for m in markers if m not in so]
          if missing:
              raise SystemExit(f'libmpv.so missing version markers: {missing}')
          print('libmpv.so version markers verified: ' + ', '.join(
              m.decode() for m in markers))
          PY

  hdr-lab-analyze:
    # The HDR diagnostics app (media_kit_hdr_lab) owns the AUTO/HDR define
    # surface and the acceptance round tooling; keep it compiling.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_package_tests == true }}
    name: media_kit_hdr_lab analyze & Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_kit_hdr_lab
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - name: Vendor dataspace subpackage JVM unit tests (private-ABI gate)
        run: |
          cd android
          ./gradlew :media_kit_android_dataspace_vendor:testDebugUnitTest
      - name: Build arm64 debug APK (native probes compile check)
        run: flutter build apk --debug --target-platform android-arm64
