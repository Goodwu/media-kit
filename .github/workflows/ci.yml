          cat pubspec.yaml
          sed -i 's/\bmedia_kit_libs\([^[ ]*\)_video\b/media_kit_libs\1_audio/g' pubspec_overrides.yaml
          cat pubspec_overrides.yaml

      - run: flutter pub get
      - run: flutter build apk --split-per-abi --verbose

  release-metadata:
    name: Release manifest and checksums
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - windows
      - windows-arm64
      - linux
      - macos
      - ios
      - android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate release metadata
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find artifacts -type f -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No build artifacts were downloaded' >&2
            exit 1
          fi
          sha256sum "${files[@]}" | sed 's#  artifacts/##' > SHA256SUMS
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('artifacts')
          entries = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              data = path.read_bytes()
              name = path.name
              lower = name.lower()
              if 'android' in lower:
                  platform = 'android'
              elif 'ios' in lower:
                  platform = 'ios'
              elif 'macos' in lower:
                  platform = 'macos'
              elif 'linux' in lower:
                  platform = 'linux'
              elif 'win' in lower:
                  platform = 'windows'
              else:
                  platform = 'unknown'
              if 'arm64' in lower or 'arm-v8a' in lower:
                  abi = 'arm64'
              elif 'armeabi-v7a' in lower:
                  abi = 'armeabi-v7a'
              elif 'x86_64' in lower or 'x64' in lower:
                  abi = 'x86_64'
              elif 'universal' in lower:
                  abi = 'universal'
              else:
                  abi = 'unspecified'
              entries.append({
                  'file': str(path.relative_to(root)),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'platform': platform,
                  'abi': abi,
              })
          manifest = {
              'schema': 1,
              'source_commit': os.environ['SOURCE_COMMIT'],
              'workflow_run_id': int(os.environ['RUN_ID']),
              'workflow_run_attempt': int(os.environ['RUN_ATTEMPT']),
              'artifacts': entries,
          }
          Path('manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          sha256sum manifest.json >> SHA256SUMS
          cat manifest.json
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: media-kit-release-metadata
          path: |
            manifest.json
            SHA256SUMS
      - uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: false
          tag_name: "vnext"
          files: |
            manifest.json
            SHA256SUMS
