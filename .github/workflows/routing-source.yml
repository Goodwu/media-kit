name: Routing source checks

on:
  push:
    branches:
      - routing/MK-ROUTING-20261011
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Push and PR events for the same branch must not duplicate the full suites.
concurrency:
  group: routing-source-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  python-tools:
    name: Routing audit utility tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run extraction and guarded-repair utility tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-tool-results
          git rev-parse HEAD | tee ci-tool-results/source.txt
          python3 -m unittest discover -s tool/routing_native_audit -v 2>&1 | tee ci-tool-results/extractor.log
          python3 -m unittest discover -s tool/routing_ci -v 2>&1 | tee ci-tool-results/repair-tool.log
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-tools-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-tool-results
          if-no-files-found: error

  flutter-source:
    name: Source analyze and tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [media_kit_video, media_kit_hdr_lab]
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Record the source under test
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ci-results/${{ matrix.package }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          {
            printf 'task=MK-ROUTING-20261011\nscope=host-source-tests\n'
            printf 'source_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'source_tree=%s\n' "$(git rev-parse HEAD^{tree})"
            flutter --version
            printf '\nNo prebuilt libmpv is installed by this job.\n'
            printf 'This job is not native-build or device acceptance.\n'
          } | tee "$GITHUB_WORKSPACE/.ci-results/${{ matrix.package }}/source.txt"
      - name: Resolve current source packages
        id: resolve
        run: |
          set -euo pipefail
          flutter pub get 2>&1 | tee "$GITHUB_WORKSPACE/.ci-results/${{ matrix.package }}/pub-get.log"
      - name: Analyze source
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: |
          set -euo pipefail
          flutter analyze --no-pub 2>&1 | tee "$GITHUB_WORKSPACE/.ci-results/${{ matrix.package }}/analyze.log"
      - name: Run source tests
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: |
          set -euo pipefail
          flutter test --no-pub --concurrency=1 --reporter expanded 2>&1 | tee "$GITHUB_WORKSPACE/.ci-results/${{ matrix.package }}/tests.log"
      - name: Compile and execute the OHOS facade on JavaScript
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' && matrix.package == 'media_kit_video' }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/.ci-results/${{ matrix.package }}"
          dart compile js test/web/ohos_sw_render_smoke.dart -o "$out/ohos-smoke.js" 2>&1 | tee "$out/ohos-js-compile.log"
          node "$out/ohos-smoke.js" 2>&1 | tee "$out/ohos-js-run.log"
      - name: Compile the OHOS facade on WebAssembly
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' && matrix.package == 'media_kit_video' }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/.ci-results/${{ matrix.package }}"
          dart compile wasm test/web/ohos_sw_render_smoke.dart -o "$out/ohos-smoke.wasm" 2>&1 | tee "$out/ohos-wasm-compile.log"
      - name: Check that testing did not rewrite source
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: git diff --exit-code -- lib test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-source-${{ matrix.package }}-${{ env.EXPECTED_SOURCE_SHA }}
          path: .ci-results/${{ matrix.package }}
          if-no-files-found: error
