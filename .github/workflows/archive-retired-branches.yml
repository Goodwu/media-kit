name: Archive retired media-kit branches (one shot)
# Exact, user-authorized branch retirement; no runtime inputs or force pushes.
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/archive-retired-branches.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: media-kit-legacy-branch-retirement
  cancel-in-progress: false

jobs:
  archive-and-delete:
    if: github.repository == 'Goodwu/media-kit' && github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Create and verify exact archive tags before deleting matching old refs
        uses: actions/github-script@v7
        with:
          script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          if (owner !== 'Goodwu' || repo !== 'media-kit' ||
              context.eventName !== 'push' || context.ref !== 'refs/heads/dev') {
            throw new Error('Branch retirement runs only on a dev push in Goodwu/media-kit');
          }
          const targets = [
            { branch: 'routing/MK-ROUTING-20261011', sha: '0597c8318ccf50f0824249ceeab310632efb84ab', tag: 'archive/routing-20261011' },
            { branch: 'compat/piliplus-zero-change-20261018', sha: 'c8c5aaab3ee777bcf1f2b87166695a9814c24772', tag: 'archive/compat-20261026' },
            { branch: 'ci/verified-native-packages-20261023', sha: 'd76622180dc9d082c9e690dd7d355f418627fb4a', tag: 'archive/native-ci-20261023' },
            { branch: 'integration/ci-compat-20261028', sha: '9c67f5305ec52fe9e12a86cdda295711161919f0', tag: 'archive/ci-compat-20261028' },
          ];
          const checkedRef = async (ref) => {
            try {
              const response = await github.rest.git.getRef({ owner, repo, ref });
              return response.data.object.sha;
            } catch (error) {
              if (error.status === 404) return null;
              throw error;
            }
          };
          const stableDev = async () => {
            const value = await checkedRef('heads/dev');
            if (value !== context.sha) {
              throw new Error('dev moved during archival: expected ' + context.sha + ', found ' + value);
            }
          };
          const noLivePRs = async () => {
            const prs = await github.paginate(github.rest.pulls.list,
              { owner, repo, state: 'open', per_page: 100 });
            for (const pr of prs) {
              for (const target of targets) {
                if ((pr.head.repo.full_name === owner + '/' + repo && pr.head.ref === target.branch)
                    || pr.base.ref === target.branch) {
                  throw new Error('Ref is still used by open PR #' + pr.number + ': ' + target.branch);
                }
              }
            }
          };
          const meta = await github.rest.repos.get({ owner, repo });
          if (meta.data.default_branch !== 'main') {
            throw new Error('Default branch unexpectedly changed: ' + meta.data.default_branch);
          }
          await stableDev();
          await noLivePRs();
          const preflight = [];
          for (const target of targets) {
            const branchSha = await checkedRef('heads/' + target.branch);
            const tagSha = await checkedRef('tags/' + target.tag);
            if (branchSha !== null && branchSha !== target.sha) {
              throw new Error('Historical head moved: ' + target.branch + ' expected=' + target.sha + ' actual=' + branchSha);
            }
            if (tagSha !== null && tagSha !== target.sha) {
              throw new Error('Archive tag collision: ' + target.tag + ' actual=' + tagSha);
            }
            if (branchSha === null && tagSha === null) {
              throw new Error('Missing both branch and archive tag: ' + target.branch);
            }
            const compared = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: target.sha + '...' + context.sha
            });
            if (compared.data.behind_by !== 0) {
              throw new Error('Old branch is not fully contained in dev: ' + target.branch);
            }
            preflight.push({ ...target, branchSha, tagSha });
          }
          for (const target of preflight) {
            if (target.tagSha === null) {
              await github.rest.git.createRef({
                owner, repo, ref: 'refs/tags/' + target.tag, sha: target.sha
              });
            }
          }
          for (const target of preflight) {
            if ((await checkedRef('tags/' + target.tag)) !== target.sha) {
              throw new Error('Unverified archive tag: ' + target.tag);
            }
          }
          await stableDev();
          await noLivePRs();
          for (const target of preflight) {
            const branchSha = await checkedRef('heads/' + target.branch);
            if (branchSha === null) {
              core.info('Already retired: ' + target.branch);
              continue;
            }
            if (branchSha !== target.sha) {
              throw new Error('Branch moved before deletion: ' + target.branch);
            }
            await github.rest.git.deleteRef({
              owner, repo, ref: 'heads/' + target.branch
            });
            if (await checkedRef('heads/' + target.branch)) {
              throw new Error('Branch remained after delete: ' + target.branch);
            }
            core.info('Archived ' + target.branch + ' at ' + target.sha + ' as ' + target.tag);
          }
          await core.summary.addHeading('Four historical branches archived').addTable(
            targets.map(t => [{ data: t.branch }, { data: t.tag }, { data: t.sha.slice(0, 12) }])
          ).write();
