name: media_kit_hdr_lab
description: HDR/DV diagnostics app split from media_kit_test.
homepage: https://github.com/media-kit/media-kit
repository: https://github.com/media-kit/media-kit
version: 1.0.0+2086
publish_to: none

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  media_kit:
    path: ../media_kit
  media_kit_video:
    path: ../media_kit_video
  media_kit_libs_video:
    path: ../libs/universal/media_kit_libs_video

  path: ^1.8.2
  file_picker: ^12.1.3
  path_provider: ^2.0.14
  http: ">=0.13.0 <2.0.0"
  crypto: ^3.0.3
  universal_platform: ^1.0.0+1
  web: ^1.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
