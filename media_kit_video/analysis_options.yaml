analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
    # Isolated OHOS entry: compiles only under the OHOS Flutter fork SDK
    # (see .github/workflows/ohos.yml), which provides OhosViewSurface and
    # the OHOS platform-view factories. The standard Flutter SDK cannot
    # resolve those APIs; test/platform_view_entry_contract_test.dart guards
    # that this file stays out of the shared entry.
    - lib/src/video/platform_view_video_ohos.dart
  errors:
    dangling_library_doc_comments: ignore
    unintended_html_in_doc_comment: ignore
include: package:flutter_lints/flutter.yaml

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
